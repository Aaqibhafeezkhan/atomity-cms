name: Feature request
description: Suggest a new feature or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Clear problems are easier to act on than solutions alone, so start with the "why".
        Adding a content type or a field is a small change that needs no database migration; see
        [Adding a content type](https://github.com/atomityhq/atomity-cms/blob/main/docs/adding-a-content-type.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: When I publish a job opening, I have no way to mark it as closed without archiving it…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Mock-ups and API sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: dropdown
    id: content_type
    attributes:
      label: Content type
      description: Which content types would this affect?
      multiple: true
      options:
        - News
        - Career opening
        - Documentation
        - Knowledge base
        - A new content type
        - All of them

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Content types and fields
        - Editor
        - Content list
        - Public API
        - Media library
        - Example website (examples/mock-consumer)
        - Developer experience / setup
        - Documentation
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
