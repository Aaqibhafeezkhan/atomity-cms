name: Documentation issue
description: Something in the docs is missing, wrong or unclear.
title: "docs: "
labels: ["documentation"]
body:
  - type: dropdown
    id: document
    attributes:
      label: Which document?
      options:
        - README.md
        - CONTRIBUTING.md
        - docs/api.md
        - docs/architecture.md
        - docs/adding-a-content-type.md
        - examples/mock-consumer/README.md
        - SECURITY.md
        - Other or not sure
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Section or line
      description: The heading, command or sentence you mean.
      placeholder: Quick start (Docker) → the "cp .env.example .env" step

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Incorrect or outdated
        - Missing
        - Unclear or confusing
        - Typo or formatting
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong, and what did you expect to find?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Proposed wording, if you have it.
