name: Bug report
description: Something doesn't work the way it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please search [existing issues](https://github.com/atomityhq/atomity-cms/issues) first.
        **Security problem?** Don't file it as a public issue. Follow [SECURITY.md](https://github.com/atomityhq/atomity-cms/blob/main/SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Publishing a career opening without an application URL shows a blank error instead of saying what is missing.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Sign in at http://localhost:3000
        2. Content → New content → Career opening
        3. Fill in a title and some text, leave "Application URL" empty
        4. Click Publish
        5. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The item is not published and the message names the missing field.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead. Include the HTTP status or error code if you know it.
      placeholder: A generic "Something went wrong" toast appears and the item stays a draft.
    validations:
      required: true

  - type: dropdown
    id: content_type
    attributes:
      label: Content type
      description: Which content type were you working with?
      options:
        - News
        - Career opening
        - Documentation
        - Knowledge base
        - Not specific to one type
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Admin UI (list, editor)
        - Backend (admin API)
        - Public API (/content-types, /content)
        - Media / image upload
        - Database / migrations
        - Docker / setup
        - Example website (examples/mock-consumer)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD`.
      placeholder: 977a548

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run it and where you see the problem.
      placeholder: |
        - Running via: docker compose (make up) / make backend + npm run dev
        - OS: macOS 15 / Ubuntu 24.04 / Windows 11
        - Browser: Chrome 130
        - Docker version (if using Docker): 27.3
        - Java / Node / npm versions (if running locally): 21 / 24 / 11.16

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Error messages, backend log lines (include the `correlationId`), browser console output or screenshots. Try `docker compose logs backend`. **Remove any secrets or tokens first.**
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I removed passwords, tokens and other secrets from what I pasted.
          required: true
